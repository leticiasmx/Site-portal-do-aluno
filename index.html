<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plataforma do Aluno</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1f2340;--mut:#6b7280;--pri:#6366f1;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#12131c;--card:#1c1e2b;--tx:#eceefb;--mut:#9aa0b8;--bd:#2c2f42}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:28px 20px 56px}
header div,main{max-width:1000px;margin:auto}
header h1{margin:0;font-size:26px}header p{margin:6px 0 0;opacity:.85}
main{margin-top:-32px;padding:0 16px 40px;position:relative}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.stats b{font-size:28px;display:block;color:var(--pri)}.stats span{color:var(--mut);font-size:13px}
h3{margin:0 0 12px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input,.row select{flex:1;min-width:140px}
input,select{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:14px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
button:disabled{opacity:.35;cursor:not-allowed}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.s{padding:5px 9px;font-size:12px;border-radius:8px}
.chips{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;color:var(--mut)}
.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 6px 4px 12px;color:var(--tx);font-size:13px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:780px}
th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--bd);font-size:14px;vertical-align:middle}
.who{display:flex;align-items:center;gap:10px}.who small{display:block;color:var(--mut)}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:#dcfce7;color:#166534}.rec{background:#fef3c7;color:#92400e}
.bad{background:#fee2e2;color:#991b1b}.lock{background:#e5e7eb;color:#374151}
.acts{display:flex;gap:4px;flex-wrap:wrap}
#msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:10px;color:#fff;font-weight:600;display:none;z-index:9;max-width:90%}
#msg.o{background:#16a34a}#msg.e{background:#dc2626}
</style></head><body>
<header><div><h1>🎓 Plataforma do Aluno</h1><p>Turmas, matrículas, notas e faltas</p></div></header>
<div id="msg"></div>
<main>
  <div class="card stats">
    <div><b id="tot">0</b><span>Alunos</span></div>
    <div><b id="atv">0</b><span>Ativos</span></div>
    <div><b id="trc">0</b><span>Trancados</span></div>
  </div>

  <div class="card"><h3>🏫 Turmas</h3>
    <div class="row">
      <input id="tnome" placeholder="Nome da turma (ex.: 3A)">
      <input id="tcap" type="number" placeholder="Capacidade (ex.: 30)">
      <button type="button" onclick="criarTurma()">Criar turma</button>
    </div>
    <div id="turmas" class="chips"></div>
  </div>

  <div class="card"><h3>➕ Nova matrícula</h3>
    <div class="row">
      <input id="nome" placeholder="Nome completo">
      <input id="mat" placeholder="Matrícula">
      <select id="sel"></select>
      <button type="button" onclick="matricular()">Matricular</button>
    </div>
  </div>

  <div class="card"><h3>🔎 Buscar</h3>
    <div class="row">
      <input id="busca" placeholder="Digite um nome">
      <button type="button" onclick="buscarNome()">Por nome</button>
      <select id="ftur" onchange="filtrar()"></select>
      <button type="button" class="g" onclick="listar()">Ver todos</button>
    </div>
  </div>

  <div class="card wrap">
    <table>
      <thead><tr><th>Aluno</th><th>Turma</th><th>N1</th><th>N2</th><th>Média</th><th>Faltas</th><th>Situação</th><th>Ações</th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
</main>

<script>
var API = "/alunos", TUR = "/turmas";

function el(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function aviso(texto, ok){
  var m = el("msg");
  m.textContent = texto; m.className = ok ? "o" : "e"; m.style.display = "block";
  clearTimeout(m.h); m.h = setTimeout(function(){ m.style.display = "none"; }, 4000);
}

async function chamar(url, metodo, corpo){
  var opt = { method: metodo || "GET" };
  if (corpo){ opt.headers = {"Content-Type":"application/json"}; opt.body = JSON.stringify(corpo); }
  var r = await fetch(url, opt), d = null;
  try { d = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(d && d.erro ? d.erro : "Erro " + r.status);
  return d;
}

async function tentar(fn){
  try { await fn(); } catch(e){ aviso(e.message, false); }
}

async function carregarTurmas(){
  var ts = await chamar(TUR);
  var op = ts.map(function(t){ return '<option value="' + t.id + '">' + esc(t.nome) + '</option>'; }).join("");
  el("sel").innerHTML = op || '<option value="">Crie uma turma primeiro</option>';
  el("ftur").innerHTML = '<option value="">Filtrar por turma...</option>' + op;
  el("turmas").innerHTML = ts.map(function(t){
    return '<span class="chip">' + esc(t.nome) + ' (' + t.totalAlunos + '/' + t.capacidade + ') '
         + '<button type="button" class="s g" onclick="excluirTurma(' + t.id + ')">✕</button></span>';
  }).join("") || "Nenhuma turma criada ainda";
}

function render(as){
  el("tot").textContent = as.length;
  el("atv").textContent = as.filter(function(a){ return a.ativo; }).length;
  el("trc").textContent = as.filter(function(a){ return !a.ativo; }).length;
  if (as.length === 0){
    el("lista").innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--mut)">Nenhum aluno encontrado</td></tr>';
    return;
  }
  el("lista").innerHTML = as.map(function(a){
    var d = a.ativo ? "" : "disabled";
    var c = a.situacao === "APROVADO" ? "ok" : a.situacao === "RECUPERAÇÃO" ? "rec" : a.situacao === "TRANCADO" ? "lock" : "bad";
    return '<tr>'
      + '<td><div class="who"><div class="av">' + esc(a.nome.charAt(0).toUpperCase()) + '</div><div>' + esc(a.nome) + '<small>Mat. ' + esc(a.matricula) + '</small></div></div></td>'
      + '<td>' + esc(a.turma) + '</td><td>' + a.nota1 + '</td><td>' + a.nota2 + '</td><td><b>' + a.media + '</b></td><td>' + a.faltas + '</td>'
      + '<td><span class="badge ' + c + '">' + a.situacao + '</span></td>'
      + '<td><div class="acts">'
      + '<button type="button" class="s" ' + d + ' onclick="nota(' + a.id + ',1)">N1</button>'
      + '<button type="button" class="s" ' + d + ' onclick="nota(' + a.id + ',2)">N2</button>'
      + '<button type="button" class="s" ' + d + ' onclick="falta(' + a.id + ')">+Falta</button>'
      + '<button type="button" class="s g" ' + d + ' onclick="trancar(' + a.id + ')">🔒</button>'
      + '<button type="button" class="s g" onclick="excluir(' + a.id + ')">🗑️</button>'
      + '</div></td></tr>';
  }).join("");
}

function listar(){ return tentar(async function(){ render(await chamar(API)); await carregarTurmas(); }); }
function buscarNome(){ return tentar(async function(){ render(await chamar(API + "/buscar/" + encodeURIComponent(el("busca").value))); }); }
function filtrar(){
  var id = el("ftur").value;
  if (!id) return listar();
  return tentar(async function(){ render(await chamar(API + "/turma/" + id)); });
}

function criarTurma(){ return tentar(async function(){
  await chamar(TUR, "POST", { nome: el("tnome").value, capacidade: Number(el("tcap").value) });
  el("tnome").value = ""; el("tcap").value = "";
  aviso("Turma criada ✅", true); await carregarTurmas();
}); }
function excluirTurma(id){
  if (!confirm("Excluir esta turma?")) return;
  return tentar(async function(){ await chamar(TUR + "/" + id, "DELETE"); aviso("Turma excluída", true); await carregarTurmas(); });
}

function matricular(){ return tentar(async function(){
  await chamar(API, "POST", { nome: el("nome").value, matricula: el("mat").value, turmaId: el("sel").value ? Number(el("sel").value) : null });
  el("nome").value = ""; el("mat").value = "";
  aviso("Aluno matriculado ✅", true); await listar();
}); }

function nota(id, prova){
  var v = prompt("Nota da prova " + prova + ":");
  if (!v) return;
  return tentar(async function(){
    await chamar(API + "/" + id + "/nota/" + prova + "/" + encodeURIComponent(v.replace(",", ".")), "POST");
    aviso("Nota lançada ✅", true); await listar();
  });
}
function falta(id){ return tentar(async function(){ await chamar(API + "/" + id + "/falta", "POST"); aviso("Falta registrada", true); await listar(); }); }
function trancar(id){
  if (!confirm("Trancar esta matrícula?")) return;
  return tentar(async function(){ await chamar(API + "/" + id + "/trancar", "PUT"); aviso("Matrícula trancada 🔒", true); await listar(); });
}
function excluir(id){
  if (!confirm("Excluir este aluno?")) return;
  return tentar(async function(){ await chamar(API + "/" + id, "DELETE"); aviso("Aluno excluído", true); await listar(); });
}

listar();
</script></body></html>
